name: Master guard

# `master` only changes through a pull request (AGENTS.md, "Branches"). GitHub cannot refuse a direct push to a
# private repository on a free plan, so this workflow reports one: it fails, which shows a red mark on the
# commit and sends an email. The pre-push hook in .githooks stops the push on a machine that has it on.
#
# It takes a few seconds. A release tag does not start it.
on:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  through-a-pull-request:
    name: The commit came through a pull request
    runs-on: ubuntu-latest
    steps:
      - name: Find the merged pull request of this commit
        run: |
          merged="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null)] | length')"
          if [ "$merged" -gt 0 ]; then
            echo "Merged through a pull request."
          else
            echo "::error::$GITHUB_SHA was pushed to master without a pull request. Revert it, and make the change on a branch."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

name: Master guard

# `master` only changes through a pull request (AGENTS.md, "Branches"). A ruleset on `master` refuses a direct
# push, and the pre-push hook in .githooks stops it on a machine that has it on. This workflow is the check
# behind both: if such a push still arrives, it fails, which shows a red mark on the commit and sends an email.
#
# It takes a few seconds. A release tag does not start it.
on:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  through-a-pull-request:
    name: The commit came through a pull request
    runs-on: ubuntu-26.04
    steps:
      - name: Find the merged pull request of this commit
        run: |
          merged="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null)] | length')"
          if [ "$merged" -gt 0 ]; then
            echo "Merged through a pull request."
          else
            echo "::error::$GITHUB_SHA was pushed to master without a pull request. Revert it, and make the change on a branch."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

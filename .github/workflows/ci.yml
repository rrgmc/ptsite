name: CI

# CI runs each thing once (docs/architecture/deployment.md, "Build (CI)"):
#
# - A pull request runs the tests. `master` only changes through pull requests, so nothing runs again there.
# - The ruleset on `master` requires the job "Checks passed" and a branch that is up to date, so the tests
#   cover what `master` will hold. Every pull request runs them, a change to docs too: a required check that
#   never ran would keep the pull request from merging.
# - The deploy package is built only when someone starts this workflow by hand (the "Run workflow" button, or
#   `gh workflow run ci.yml`). Nobody uses CI's package for now: `task deploy` builds its own.
on:
  pull_request:
  workflow_dispatch:

# A pull request from a fork runs this workflow too. It only reads the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Pint, Pest, API spec)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    # The same MySQL as compose.yaml: the shared host's version, with its data in memory.
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --tmpfs /var/lib/mysql:rw
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 2s --health-timeout 5s --health-retries 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, intl, gd, exif
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      # Without a list of words this refuses only an image nobody listed. A site runs it with its own names.
      - name: No unlisted image (deploy/check-forbidden.php)
        run: php deploy/check-forbidden.php
        working-directory: .
      - name: Code style
        run: vendor/bin/pint --test
      - name: Tests (domain, architecture, API)
        run: vendor/bin/pest
      - name: OpenAPI spec is up to date
        run: |
          php artisan ptsite:prepare-database && php artisan migrate --force -q
          php artisan scramble:export --path=../frontend/openapi.json
          git diff --exit-code -- ../frontend/openapi.json || (echo "::error::frontend/openapi.json is out of date. Run: php artisan scramble:export --path=../frontend/openapi.json, then npm run api:types in frontend." && exit 1)

  example-site:
    name: Example site (the package and the frontend, built for another site in English)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --tmpfs /var/lib/mysql:rw
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 2s --health-timeout 5s --health-retries 60
    defaults:
      run:
        working-directory: examples/site/backend
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, intl, gd, exif
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The package comes from ../../../backend through a path repository, without its development packages.
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Build the frontend for this site, from its own site folder
        run: npm ci && npx vite build
        working-directory: frontend
        env:
          PTSITE_SITE_DIR: ../examples/site/site
          PTSITE_OUT_DIR: ../examples/site/backend/public/app
      - run: cp .env.example .env && php artisan key:generate
      - name: Migrate and seed the demo league, with this site's table prefix
        run: |
          php artisan ptsite:prepare-database
          php artisan migrate --force
          php artisan db:seed --class='PTSite\Database\Seeders\DemoLeagueSeeder' --force
          php artisan ptsite:verify
      - name: The API answers, in the site's language
        run: |
          php artisan serve --port=8000 > storage/logs/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/up > /dev/null && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: application/json' http://127.0.0.1:8000/api/v1/seasons)" = 401
          curl -s -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{"username":"aldemir","password":"errada"}'             http://127.0.0.1:8000/api/v1/login | grep -q 'Wrong username or password'
      - name: The app is in English, with this site's own wording for two texts
        run: grep -rqF 'Keep me signed in for 30 days' public/app/assets
      - name: The page and the installed app carry the site's name and main color
        run: |
          curl -s http://127.0.0.1:8000/app/ | grep -q '<title>Example Club</title>'
          curl -s http://127.0.0.1:8000/app/ | grep -q '<html lang="en-US">'
          curl -s http://127.0.0.1:8000/app/manifest.webmanifest | grep -q '"theme_color": "#1e3a8a"'

  frontend:
    name: Frontend (lint, types, unit, build)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types match the spec
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts || (echo "::error::Run npm run api:types and commit src/api/schema.d.ts." && exit 1)
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  storybook:
    name: Storybook ${{ matrix.shard }}/${{ strategy.job-total }} (every story renders and passes axe)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    # Two jobs, each with half of the stories. A job is about half setup already, and the end-to-end jobs below
    # take longer, so more jobs here would not shorten a run.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Without --with-deps: the runner already has the browser's libraries, and the option only adds fonts
      # that no test needs, from a package mirror that is sometimes very slow.
      - run: npm ci && npx playwright install chromium
      - run: npm run build-storybook
      - name: Every story renders and passes axe
        run: npm run test:storybook -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  e2e:
    name: End-to-end ${{ matrix.shard }}/${{ strategy.job-total }} (phone and desktop, axe)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    # Four jobs, each with a quarter of the test files: the tests are the slowest part of CI. Each job spends
    # about a minute and a half on setup, so more jobs than this gain little. When one job fails the others
    # still finish, so one run shows every failing test.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --tmpfs /var/lib/mysql:rw
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 2s --health-timeout 5s --health-retries 60
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, intl, gd, exif
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: backend
      - run: cp .env.example .env && php artisan key:generate
        working-directory: backend
      - run: npm ci && npm run build && npx playwright install chromium
        working-directory: frontend
      # The test servers run under gdb, so a crash of PHP itself prints a backtrace (see tests/php-server.ts).
      # The package mirror is sometimes very slow, and gdb only helps to read a crash. So the install gets at
      # most a minute, and the tests run without gdb when that is not enough.
      - name: Install gdb, if the package mirror answers in time
        id: gdb
        run: |
          if sudo timeout 30 apt-get update -q && sudo timeout 30 apt-get install -y -q gdb; then
            echo "use=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::gdb is not installed: the package mirror was too slow. A crash of PHP will have no backtrace."
          fi
      - name: PHP opcache settings (the test servers turn the JIT off)
        run: php -i | grep -E '^opcache\.(enable|enable_cli|jit|jit_buffer_size) '
      # One job runs both sizes at once, so it takes less time.
      - name: End-to-end tests, phone and desktop side by side
        run: npm run test:e2e:parallel -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        working-directory: frontend
        env:
          E2E_GDB: ${{ steps.gdb.outputs.use }}
      - name: Show the end of the test servers' logs
        if: failure()
        run: for f in storage/logs/*.log; do echo "=== $f"; tail -n 80 "$f"; done
        working-directory: backend
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: |
            frontend/test-results
            backend/storage/logs/*.log

  # The one check the ruleset on `master` requires. It stands for all the jobs above, so adding, renaming or
  # splitting one of them does not change the ruleset.
  checks-passed:
    name: Checks passed
    if: always() && github.event_name == 'pull_request'
    needs: [backend, example-site, frontend, storybook, e2e]
    runs-on: ubuntu-26.04
    steps:
      - name: Every job passed
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE 'failure|cancelled|skipped'; then
            echo "::error::A job failed, was cancelled or did not run."
            exit 1
          fi
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}

  package:
    name: Build the deploy package (not uploaded)
    # Off unless the workflow is started by hand. It only stores the zip as an artifact: uploading it to the
    # site is `task deploy:ci`, from a developer's machine.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Build the upload package (see docs/architecture/deployment.md)
        run: |
          name=ptsite-${{ github.sha }}.zip
          (cd frontend && npm run build)
          (cd backend && zip -qr "../$name" . -x '.env' 'database/*.sqlite*' 'storage/logs/*' 'tests/*' 'node_modules/*')
          ls -la *.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ptsite-deploy-${{ github.sha }}
          path: ptsite-${{ github.sha }}.zip
          # Stored artifacts count against the plan for as long as they are kept. `task deploy` builds the
          # package of an older commit again.
          retention-days: 3
